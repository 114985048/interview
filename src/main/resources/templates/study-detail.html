<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习记录详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            min-height: calc(100vh - 40px);
        }
        .sidebar {
            width: 220px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 25px 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 15px;
        }
        .sidebar-title {
            color: #333;
            font-size: 20px;
            font-weight: 600;
        }
        .sidebar-subtitle {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        .nav-menu {
            list-style: none;
            flex: 1;
        }
        .nav-item {
            margin: 5px 0;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            color: #555;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        .nav-link:hover {
            background: #f8f9fa;
            color: #11998e;
        }
        .nav-link.active {
            background: linear-gradient(90deg, rgba(17, 153, 142, 0.1) 0%, transparent 100%);
            color: #11998e;
            border-left-color: #11998e;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .container {
            flex: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #11998e;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .detail-title {
            font-size: 24px;
            color: #333;
            font-weight: 600;
        }
        .detail-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-warning {
            background: #ffc107;
            color: #212529;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .info-label {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .info-value {
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }
        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .badge-primary {
            background: #e3f2fd;
            color: #0d47a1;
        }
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        .difficulty-easy {
            color: #28a745;
        }
        .difficulty-medium {
            color: #ffc107;
        }
        .difficulty-hard {
            color: #dc3545;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e, #38ef7d);
            border-radius: 6px;
        }
        .content-section {
            margin-bottom: 25px;
        }
        .content-title {
            font-size: 16px;
            color: #11998e;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e0e0e0;
        }
        .content-text {
            color: #555;
            line-height: 1.8;
            white-space: pre-wrap;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }
        .empty-content {
            color: #999;
            font-style: italic;
        }
        .meta-info {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #888;
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="main-wrapper">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">📚 管理系统</div>
            <div class="sidebar-subtitle">个人成长记录平台</div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a th:href="@{/records}" class="nav-link">
                    <span class="nav-icon">💼</span>
                    <span>面试记录</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/study}" class="nav-link active">
                    <span class="nav-icon">📖</span>
                    <span>学习记录</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/diary}" class="nav-link">
                    <span class="nav-icon">📔</span>
                    <span>我的日记</span>
                </a>
            </li>
        </ul>
        <div style="padding: 15px 20px; border-top: 2px solid #f0f0f0;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <span style="font-size: 20px;">👤</span>
                <span style="font-weight: 600; color: #333; font-size: 14px;" sec:authentication="name"></span>
            </div>
            <a th:href="@{/logout}" style="display: block; padding: 8px 12px; background: #f8f9fa; color: #666; text-decoration: none; border-radius: 6px; font-size: 13px; text-align: center; transition: all 0.3s ease;">退出登录</a>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="container">
        <div class="detail-header">
            <h2>学习记录详情</h2>
            <div class="detail-actions">
                <a th:href="@{/study/{id}/edit(id=${record.studyId})}" class="btn btn-warning">编辑</a>
                <form th:action="@{/study/{id}/delete(id=${record.studyId})}" method="post" style="display:inline;" onsubmit="return confirm('确定要删除这条学习记录吗？删除后不可恢复');">
                    <button type="submit" class="btn btn-danger">删除</button>
                </form>
                <a th:href="@{/study}" class="btn btn-secondary">返回列表</a>
            </div>
        </div>

        <div class="detail-title" th:text="${record.subject}">学习主题</div>

        <div class="info-grid">
            <div class="info-card">
                <div class="info-label">学习类型</div>
                <div class="info-value">
                    <span th:switch="${record.studyType.name()}">
                        <span th:case="'TECH'" class="badge badge-primary">技术学习</span>
                        <span th:case="'ALGORITHM'" class="badge badge-success">算法练习</span>
                        <span th:case="'PROJECT'" class="badge badge-warning">项目实战</span>
                        <span th:case="'READING'" class="badge badge-primary">阅读笔记</span>
                        <span th:case="*" class="badge badge-secondary">其他</span>
                    </span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-label">难度等级</div>
                <div class="info-value" th:class="${record.difficulty.name() == 'EASY' ? 'difficulty-easy' : (record.difficulty.name() == 'MEDIUM' ? 'difficulty-medium' : 'difficulty-hard')}">
                    <span th:switch="${record.difficulty.name()}">
                        <span th:case="'EASY'">⭐ 简单</span>
                        <span th:case="'MEDIUM'">⭐⭐ 中等</span>
                        <span th:case="'HARD'">⭐⭐⭐ 困难</span>
                    </span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-label">掌握程度</div>
                <div class="info-value">
                    <span th:switch="${record.masteryLevel.name()}">
                        <span th:case="'BEGINNER'">🌱 初学</span>
                        <span th:case="'FAMILIAR'">🌿 熟悉</span>
                        <span th:case="'PROFICIENT'">🌳 熟练</span>
                        <span th:case="'MASTER'">🏆 精通</span>
                    </span>
                </div>
            </div>
            <div class="info-card">
                <div class="info-label">学习时长</div>
                <div class="info-value" th:text="${record.duration + ' 分钟'}">60 分钟</div>
            </div>
        </div>

        <div class="content-section">
            <div class="content-title">📊 学习进度</div>
            <div class="progress-bar">
                <div class="progress-fill" th:style="'width:' + ${record.progress} + '%'"></div>
            </div>
            <div style="text-align: center; margin-top: 10px; color: #11998e; font-weight: 600;" th:text="${record.progress} + '% 已完成'">50% 已完成</div>
        </div>

        <div class="content-section">
            <div class="content-title">📝 学习内容</div>
            <div class="content-text" th:if="${record.content != null && !record.content.isEmpty()}" th:text="${record.content}">学习内容...</div>
            <div class="content-text empty-content" th:if="${record.content == null || record.content.isEmpty()}">暂无学习内容记录</div>
        </div>

        <div class="content-section">
            <div class="content-title">💡 重点笔记</div>
            <div class="content-text" th:if="${record.keyPoints != null && !record.keyPoints.isEmpty()}" th:text="${record.keyPoints}">重点笔记...</div>
            <div class="content-text empty-content" th:if="${record.keyPoints == null || record.keyPoints.isEmpty()}">暂无重点笔记</div>
        </div>

        <div class="content-section">
            <div class="content-title">❓ 疑问记录</div>
            <div class="content-text" th:if="${record.questions != null && !record.questions.isEmpty()}" th:text="${record.questions}">疑问记录...</div>
            <div class="content-text empty-content" th:if="${record.questions == null || record.questions.isEmpty()}">暂无疑问记录</div>
        </div>

        <div class="meta-info">
            <span>📅 学习时间：<span th:text="${#temporals.format(record.studyDate, 'yyyy-MM-dd HH:mm')}"></span></span>
            <span>🕐 创建时间：<span th:text="${#temporals.format(record.createdAt, 'yyyy-MM-dd HH:mm')}"></span></span>
            <span>🔄 更新时间：<span th:text="${#temporals.format(record.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></span>
        </div>
    </div>
</div>
</body>
</html>
