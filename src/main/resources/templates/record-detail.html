<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试记录详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #ff6b6b;
            flex-wrap: wrap;
            gap: 15px;
        }
        h2 {
            color: #333;
            font-size: 28px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 详情卡片 */
        .detail-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff6b6b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .detail-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ff6b6b;
        }
        .detail-item.full-width {
            grid-column: 1 / -1;
        }
        .detail-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .detail-value {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .badge-type {
            background: #e3f2fd;
            color: #1976d2;
        }
        .badge-result-pending {
            background: #fff3e0;
            color: #f57c00;
        }
        .badge-result-passed {
            background: #d4edda;
            color: #155724;
        }
        .badge-result-failed {
            background: #f8d7da;
            color: #721c24;
        }
        .badge-result-gaveup {
            background: #e2e3e5;
            color: #383d41;
        }
        .difficulty-stars {
            color: #ffc107;
        }

        /* 内容区块 */
        .content-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.8;
            color: #555;
            white-space: pre-wrap;
            min-height: 80px;
        }
        .content-box.empty {
            color: #999;
            font-style: italic;
        }

        /* 问题列表 */
        .questions-list {
            background: white;
            padding: 20px;
            border-radius: 10px;
            list-style: none;
            counter-reset: question-counter;
        }
        .questions-list li {
            position: relative;
            padding: 15px 15px 15px 50px;
            margin-bottom: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .questions-list li:last-child {
            margin-bottom: 0;
        }
        .questions-list li::before {
            counter-increment: question-counter;
            content: counter(question-counter);
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        /* 操作按钮 */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-edit {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #212529;
        }
        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 193, 7, 0.4);
        }
        .btn-delete {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
        }
        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
        }

        /* 时间信息 */
        .meta-info {
            display: flex;
            gap: 20px;
            justify-content: flex-end;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            h2 {
                font-size: 22px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .actions {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>💼 面试记录详情</h2>
        <a th:href="@{/records}" class="btn-back">← 返回列表</a>
    </div>

    <!-- 公司信息 -->
    <div class="detail-section">
        <div class="section-title">🏢 公司信息</div>
        <div class="detail-grid">
            <div class="detail-item">
                <div class="detail-label">公司名称</div>
                <div class="detail-value" th:text="${record.companyName}"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">公司类型</div>
                <div class="detail-value">
                    <span class="badge badge-type" th:text="${record.companyType.name() == 'SELF_RESEARCH' ? '自研' : '外包'}"></span>
                </div>
            </div>
            <div class="detail-item">
                <div class="detail-label">职位</div>
                <div class="detail-value" th:text="${record.position} ?: '未填写'"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">薪资范围</div>
                <div class="detail-value" th:text="${record.salaryRange} ?: '未填写'"></div>
            </div>
            <div class="detail-item full-width">
                <div class="detail-label">公司地址</div>
                <div class="detail-value" th:text="${record.companyAddress} ?: '未填写'"></div>
            </div>
        </div>
    </div>

    <!-- 面试信息 -->
    <div class="detail-section">
        <div class="section-title">📝 面试信息</div>
        <div class="detail-grid">
            <div class="detail-item">
                <div class="detail-label">面试日期</div>
                <div class="detail-value" th:text="${#temporals.format(record.interviewDate, 'yyyy-MM-dd HH:mm')}"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">面试结果</div>
                <div class="detail-value">
                    <span th:class="'badge badge-result-' + ${record.interviewResult.name().toLowerCase()}"
                          th:text="${record.interviewResult.displayName}"></span>
                </div>
            </div>
            <div class="detail-item">
                <div class="detail-label">面试轮次</div>
                <div class="detail-value" th:text="${record.interviewRound} ? '第 ' + ${record.interviewRound} + ' 轮' : '未填写'"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">面试难度</div>
                <div class="detail-value">
                    <span class="difficulty-stars" th:if="${record.difficulty}">
                        <span th:each="i : ${#numbers.sequence(1, record.difficulty)}">⭐</span>
                    </span>
                    <span th:if="${record.difficulty == null}">未评分</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 面试内容 -->
    <div class="detail-section" th:if="${record.interviewContent}">
        <div class="section-title">💬 面试过程记录</div>
        <div class="content-box" th:text="${record.interviewContent}"></div>
    </div>

    <!-- 面试问题 -->
    <div class="detail-section" th:if="${record.questions}">
        <div class="section-title">❓ 面试问题</div>
        <ul class="questions-list">
            <li th:each="line : ${#strings.arraySplit(record.questions, '\n')}" 
                th:if="${!#strings.isEmpty(#strings.trim(line))}"
                th:text="${#strings.trim(line)}"></li>
        </ul>
    </div>

    <!-- 总结反思 -->
    <div class="detail-section" th:if="${record.summary}">
        <div class="section-title">📝 总结反思</div>
        <div class="content-box" th:text="${record.summary}"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
        <a th:href="@{/records/{id}/edit(id=${record.interviewId})}" class="btn btn-edit">✎ 编辑记录</a>
        <form th:action="@{/records/{id}/delete(id=${record.interviewId})}" method="post" style="display:inline;" 
              onsubmit="return confirm('确定要删除这条面试记录吗？删除后不可恢复');">
            <button type="submit" class="btn btn-delete">🗑 删除记录</button>
        </form>
    </div>

    <!-- 元信息 -->
    <div class="meta-info">
        <span th:if="${record.createdAt}">创建时间: <span th:text="${#temporals.format(record.createdAt, 'yyyy-MM-dd HH:mm')}"></span></span>
        <span th:if="${record.updatedAt}">更新时间: <span th:text="${#temporals.format(record.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></span>
    </div>
</div>
</body>
</html>
