<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的日记 - 管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            min-height: calc(100vh - 40px);
        }
        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sidebar.collapsed {
            width: 70px;
        }
        .sidebar.collapsed .sidebar-title-text,
        .sidebar.collapsed .sidebar-subtitle,
        .sidebar.collapsed .nav-text,
        .sidebar.collapsed .user-name,
        .sidebar.collapsed .logout-text {
            opacity: 0;
            visibility: hidden;
            width: 0;
            overflow: hidden;
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
        }
        .sidebar.collapsed .toggle-btn {
            transform: rotate(180deg);
        }
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .sidebar-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .sidebar-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            margin-top: 3px;
            transition: all 0.3s ease;
        }
        .nav-menu {
            list-style: none;
            flex: 1;
            padding: 0 12px;
        }
        .nav-item {
            margin: 8px 0;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.3) 0%, transparent 100%);
            transition: width 0.3s ease;
        }
        .nav-link:hover {
            color: white;
            background: rgba(255,255,255,0.05);
        }
        .nav-link:hover::before {
            width: 100%;
        }
        .nav-link.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .nav-text {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .user-name {
            color: white;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: rgba(220, 53, 69, 0.3);
            color: white;
        }
        .container {
            flex: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            overflow-x: auto;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
            flex-wrap: wrap;
            gap: 15px;
        }
        h2 {
            color: #333;
            font-size: 28px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }
        .msg-success {
            background: #d4edda;
            color: #155724;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #28a745;
        }
        .msg-error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #dc3545;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .diary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .diary-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .diary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-color: #667eea;
        }
        .diary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        }
        .diary-date {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .diary-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .diary-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .diary-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #e3f2fd;
            color: #1976d2;
        }
        .diary-mood {
            background: #fff3e0;
            color: #f57c00;
        }
        .diary-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            margin-bottom: 15px;
        }
        .diary-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            grid-column: 1 / -1;
        }
        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #666;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-number {
            font-size: 24px;
            font-weight: 700;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .pagination a, .pagination span {
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .pagination a {
            background: #f8f9fa;
            color: #667eea;
            border: 1px solid #e0e0e0;
        }
        .pagination a:hover {
            background: #667eea;
            color: white;
        }
        .pagination .current {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .pagination .disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        /* 移动端响应式 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .main-wrapper {
                flex-direction: column;
                gap: 10px;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                padding: 15px;
                min-height: auto;
            }
            .sidebar.collapsed {
                width: 100%;
            }
            .toggle-btn {
                display: none;
            }
            .sidebar-header {
                border-bottom: none;
                margin-bottom: 0;
                padding: 0;
            }
            .sidebar-subtitle {
                display: none;
            }
            .nav-menu {
                display: flex;
                flex-direction: row;
                padding: 0;
                gap: 10px;
                justify-content: center;
                flex: 1;
            }
            .nav-item {
                margin: 0;
            }
            .nav-link {
                padding: 10px 14px;
            }
            .nav-text {
                display: none;
            }
            .sidebar-footer {
                display: none;
            }
            .container {
                padding: 20px;
            }
            h2 {
                font-size: 22px;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .diary-grid {
                grid-template-columns: 1fr;
            }
            .search-bar {
                flex-direction: column;
            }
            .search-input {
                width: 100%;
            }
            .stats-bar {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .diary-card {
                padding: 15px;
            }
            .diary-title {
                font-size: 16px;
            }
            .stat-item {
                padding: 10px 15px;
            }
            .stat-number {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="main-wrapper">
    <!-- 左侧导航栏 -->
    <aside class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
        <div class="sidebar-header">
            <div class="logo-icon">📚</div>
            <div>
                <div class="sidebar-title sidebar-title-text">管理系统</div>
                <div class="sidebar-subtitle">个人成长记录平台</div>
            </div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a th:href="@{/records}" class="nav-link">
                    <span class="nav-icon">💼</span>
                    <span class="nav-text">面试记录</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/study}" class="nav-link">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">学习记录</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/diary}" class="nav-link active">
                    <span class="nav-icon">📔</span>
                    <span class="nav-text">我的日记</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <span class="user-name" sec:authentication="name"></span>
            </div>
            <a th:href="@{/logout}" class="logout-btn">
                <span>🚪</span>
                <span class="logout-text">退出登录</span>
            </a>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="container">
        <div class="page-header">
            <h2 th:text="${isAdmin} ? '📔 所有日记' : '📔 我的日记'">📔 我的日记</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a th:href="@{/diary/new}" class="btn btn-primary">+ 新建日记</a>
            </div>
        </div>

        <p th:if="${successMessage}" th:text="${successMessage}" class="msg-success"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="msg-error"></p>

        <!-- 统计信息 -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-number" th:text="${totalCount}">0</span>
                <span class="stat-label">篇日记</span>
            </div>
        </div>

        <!-- 搜索栏 -->
        <form th:action="@{/diary/search}" method="get" class="search-bar">
            <input type="text" name="keyword" class="search-input" placeholder="搜索日记内容..."
                   th:value="${keyword}" required>
            <button type="submit" class="btn btn-primary">🔍 搜索</button>
            <a th:href="@{/diary}" class="btn btn-secondary" th:if="${searchMode}">重置</a>
        </form>

        <!-- 日记卡片网格 -->
        <div class="diary-grid">
            <div th:if="${#lists.isEmpty(diaries)}" class="empty-state">
                <div class="empty-state-icon">📔</div>
                <h3>还没有日记</h3>
                <p>开始记录你的生活点滴吧~</p>
            </div>

            <div th:each="diary : ${diaries}" class="diary-card" th:onclick="'location.href=\'' + @{/diary/{id}(id=${diary.diaryId})} + '\''">
                <div class="diary-date">
                    📅 <span th:text="${#dates.format(diary.diaryDate, 'yyyy年MM月dd日')}"></span>
                    <span th:if="${#dates.format(diary.diaryDate, 'yyyy-MM-dd') == #dates.format(#dates.createNow(), 'yyyy-MM-dd')}" style="color: #667eea; font-weight: 600;">(今天)</span>
                    <span th:if="${isAdmin}" style="color: #764ba2; font-weight: 500; margin-left: 8px;">👤 <span th:text="${userNameMap != null ? userNameMap[diary.userId] : ''}"></span></span>
                </div>
                <div class="diary-title" th:text="${diary.title} ?: '无标题'"></div>
                <div class="diary-meta">
                    <span class="diary-badge" th:if="${diary.weather}" th:text="${diary.weather}"></span>
                    <span class="diary-badge diary-mood" th:if="${diary.mood}" th:text="${diary.mood}"></span>
                </div>
                <div class="diary-preview" th:text="${diary.content} ?: '暂无内容'"></div>
                <div class="diary-actions" onclick="event.stopPropagation();">
                    <a th:href="@{/diary/{id}/edit(id=${diary.diaryId})}" class="btn btn-small btn-primary">编辑</a>
                    <form th:action="@{/diary/{id}/delete(id=${diary.diaryId})}" method="post" style="display:inline;"
                          onsubmit="return confirm('确定要删除这篇日记吗？');">
                        <button type="submit" class="btn btn-small btn-danger">删除</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 分页 -->
        <div class="pagination" th:if="${diaryPage != null && diaryPage.totalPages > 1}">
            <a th:if="${diaryPage.hasPrevious()}" th:href="@{/diary(page=${diaryPage.number - 1})}">上一页</a>
            <span th:if="${!diaryPage.hasPrevious()}" class="disabled">上一页</span>

            <span th:each="i : ${#numbers.sequence(0, diaryPage.totalPages - 1)}">
                <span th:if="${i == diaryPage.number}" class="current" th:text="${i + 1}"></span>
                <a th:if="${i != diaryPage.number}" th:href="@{/diary(page=${i})}" th:text="${i + 1}"></a>
            </span>

            <a th:if="${diaryPage.hasNext()}" th:href="@{/diary(page=${diaryPage.number + 1})}">下一页</a>
            <span th:if="${!diaryPage.hasNext()}" class="disabled">下一页</span>
        </div>
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }

    document.addEventListener('DOMContentLoaded', function() {
        const sidebar = document.getElementById('sidebar');
        const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        if (isCollapsed) {
            sidebar.classList.add('collapsed');
        }
    });
</script>
</body>
</html>
