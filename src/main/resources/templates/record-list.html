<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>面试记录管理 - 列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            min-height: calc(100vh - 40px);
        }
        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sidebar.collapsed {
            width: 70px;
        }
        .sidebar.collapsed .sidebar-title-text,
        .sidebar.collapsed .sidebar-subtitle,
        .sidebar.collapsed .nav-text,
        .sidebar.collapsed .user-name,
        .sidebar.collapsed .logout-text {
            opacity: 0;
            visibility: hidden;
            width: 0;
            overflow: hidden;
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.6);
        }
        .sidebar.collapsed .toggle-btn {
            transform: rotate(180deg);
        }
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .sidebar-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .sidebar-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            margin-top: 3px;
            transition: all 0.3s ease;
        }
        .nav-menu {
            list-style: none;
            flex: 1;
            padding: 0 12px;
        }
        .nav-item {
            margin: 8px 0;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, rgba(255, 107, 107, 0.3) 0%, transparent 100%);
            transition: width 0.3s ease;
        }
        .nav-link:hover {
            color: white;
            background: rgba(255,255,255,0.05);
        }
        .nav-link:hover::before {
            width: 100%;
        }
        .nav-link.active {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.3) 0%, rgba(254, 202, 87, 0.3) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .nav-text {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .user-name {
            color: white;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: rgba(220, 53, 69, 0.3);
            color: white;
        }
        .container {
            flex: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            overflow-x: auto;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #ff6b6b;
            flex-wrap: wrap;
            gap: 15px;
        }
        h2 {
            color: #333;
            font-size: 28px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }
        .msg-success {
            background: #d4edda;
            color: #155724;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #28a745;
        }
        .msg-error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #dc3545;
        }
        .search-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            align-items: center;
        }
        .form-row:last-child {
            margin-bottom: 0;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
        }
        input, select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ff6b6b;
        }

        /* 卡片网格布局 */
        .record-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .record-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .record-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-color: #ff6b6b;
        }
        .record-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #ff6b6b 0%, #feca57 100%);
        }
        .record-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .record-card-company {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .record-card-date {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }
        .record-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-type {
            background: #e3f2fd;
            color: #1976d2;
        }
        .badge-result-pending {
            background: #fff3e0;
            color: #f57c00;
        }
        .badge-result-passed {
            background: #d4edda;
            color: #155724;
        }
        .badge-result-failed {
            background: #f8d7da;
            color: #721c24;
        }
        .badge-result-gaveup {
            background: #e2e3e5;
            color: #383d41;
        }
        .badge-salary {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .badge-position {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .record-card-difficulty {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 12px;
        }
        .difficulty-label {
            font-size: 12px;
            color: #666;
        }
        .difficulty-stars {
            color: #ffc107;
        }
        .record-card-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 15px;
        }
        .record-card-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            grid-column: 1 / -1;
        }
        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #666;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-number {
            font-size: 24px;
            font-weight: 700;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        /* 移动端响应式 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .main-wrapper {
                flex-direction: column;
                gap: 10px;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                padding: 15px;
                min-height: auto;
            }
            .sidebar.collapsed {
                width: 100%;
            }
            .toggle-btn {
                display: none;
            }
            .sidebar-header {
                border-bottom: none;
                margin-bottom: 0;
                padding: 0;
            }
            .sidebar-subtitle {
                display: none;
            }
            .nav-menu {
                display: flex;
                flex-direction: row;
                padding: 0;
                gap: 10px;
                justify-content: center;
                flex: 1;
            }
            .nav-item {
                margin: 0;
            }
            .nav-link {
                padding: 10px 14px;
            }
            .nav-text {
                display: none;
            }
            .sidebar-footer {
                display: none;
            }
            .container {
                padding: 20px;
            }
            h2 {
                font-size: 22px;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .record-grid {
                grid-template-columns: 1fr;
            }
            .search-form .form-row {
                flex-direction: column;
                gap: 10px;
            }
            .search-form label {
                width: 100%;
            }
            .search-form input, .search-form select {
                width: 100%;
            }
            .stats-bar {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .record-card {
                padding: 15px;
            }
            .record-card-company {
                font-size: 16px;
            }
            .stat-item {
                padding: 10px 15px;
            }
            .stat-number {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="main-wrapper">
    <!-- 左侧导航栏 -->
    <aside class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
        <div class="sidebar-header">
            <div class="logo-icon">📚</div>
            <div>
                <div class="sidebar-title sidebar-title-text">管理系统</div>
                <div class="sidebar-subtitle">个人成长记录平台</div>
            </div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a th:href="@{/records}" class="nav-link active">
                    <span class="nav-icon">💼</span>
                    <span class="nav-text">面试记录</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/study}" class="nav-link">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">学习记录</span>
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/diary}" class="nav-link">
                    <span class="nav-icon">📔</span>
                    <span class="nav-text">我的日记</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <span class="user-name" sec:authentication="name"></span>
            </div>
            <a th:href="@{/logout}" class="logout-btn">
                <span>🚪</span>
                <span class="logout-text">退出登录</span>
            </a>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="container">
        <div class="page-header">
            <h2>💼 面试记录管理</h2>
            <a th:href="@{/records/new}" class="btn btn-primary">+ 新增面试记录</a>
        </div>

        <p th:if="${successMessage}" th:text="${successMessage}" class="msg-success"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="msg-error"></p>

        <!-- 统计信息 -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-number" th:text="${#lists.size(records)}">0</span>
                <span class="stat-label">条记录</span>
            </div>
        </div>

        <!-- 搜索表单 -->
        <form th:action="@{/records}" method="get" th:object="${searchForm}" class="search-form">
            <div class="form-row">
                <label>公司名称:
                    <input type="text" th:field="*{companyName}" placeholder="输入公司名称">
                </label>
                <label>公司类型:
                    <select th:field="*{companyType}">
                        <option value="">全部</option>
                        <option th:each="type : ${T(com.wu.model.CompanyType).values()}"
                                th:value="${type}"
                                th:text="${type.name() == 'SELF_RESEARCH' ? '自研' : '外包'}"></option>
                    </select>
                </label>
                <label>面试结果:
                    <select th:field="*{interviewResult}">
                        <option value="">全部</option>
                        <option th:each="result : ${T(com.wu.model.InterviewResult).values()}"
                                th:value="${result}"
                                th:text="${result.displayName}"></option>
                    </select>
                </label>
                <label>职位:
                    <input type="text" th:field="*{position}" placeholder="输入职位">
                </label>
            </div>
            <div class="form-row">
                <label>薪资范围:
                    <input type="text" th:field="*{salaryRange}" placeholder="如 15k-20k">
                </label>
                <label>难度:
                    <select th:field="*{difficulty}">
                        <option value="">全部</option>
                        <option value="1">⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="5">⭐⭐⭐⭐⭐</option>
                    </select>
                </label>
                <label>排序字段:
                    <select th:field="*{sortBy}">
                        <option value="interviewDate">面试日期</option>
                        <option value="companyName">公司名称</option>
                        <option value="salaryRange">薪资范围</option>
                    </select>
                </label>
                <label>排序方向:
                    <select th:field="*{direction}">
                        <option value="desc">倒序</option>
                        <option value="asc">正序</option>
                    </select>
                </label>
                <button type="submit" class="btn btn-primary">🔍 查询</button>
            </div>
        </form>

        <!-- 面试记录卡片网格 -->
        <div class="record-grid">
            <div th:if="${#lists.isEmpty(records)}" class="empty-state">
                <div class="empty-state-icon">💼</div>
                <h3>还没有面试记录</h3>
                <p>开始记录你的面试经历吧~</p>
            </div>

            <div th:each="record : ${records}" class="record-card" th:onclick="'location.href=\'' + @{/records/{id}(id=${record.interviewId})} + '\''">
                <div class="record-card-header">
                    <div class="record-card-company" th:text="${record.companyName}">公司名称</div>
                    <div class="record-card-date">
                        📅 <span th:text="${#temporals.format(record.interviewDate, 'yyyy-MM-dd')}"></span>
                    </div>
                </div>
                <div class="record-card-meta">
                    <span class="badge badge-type" th:text="${record.companyType.name() == 'SELF_RESEARCH' ? '自研' : '外包'}"></span>
                    <span th:class="'badge badge-result-' + ${record.interviewResult.name().toLowerCase()}"
                          th:text="${record.interviewResult.displayName}"></span>
                    <span class="badge badge-position" th:if="${record.position}" th:text="${record.position}"></span>
                    <span class="badge badge-salary" th:if="${record.salaryRange}" th:text="${record.salaryRange}"></span>
                </div>
                <div class="record-card-difficulty" th:if="${record.difficulty}">
                    <span class="difficulty-label">难度:</span>
                    <span class="difficulty-stars">
                        <span th:each="i : ${#numbers.sequence(1, record.difficulty)}">⭐</span>
                    </span>
                </div>
                <div class="record-card-preview" th:text="${record.summary} ?: ${record.interviewContent} ?: '暂无内容'">预览内容</div>
                <div class="record-card-actions" onclick="event.stopPropagation();">
                    <a th:href="@{/records/{id}(id=${record.interviewId})}" class="btn btn-small btn-secondary">详情</a>
                    <a th:href="@{/records/{id}/edit(id=${record.interviewId})}" class="btn btn-small btn-primary">编辑</a>
                    <form th:action="@{/records/{id}/delete(id=${record.interviewId})}" method="post" style="display:inline;"
                          onsubmit="return confirm('确定要删除这条面试记录吗？');">
                        <button type="submit" class="btn btn-small btn-danger">删除</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }

    document.addEventListener('DOMContentLoaded', function() {
        const sidebar = document.getElementById('sidebar');
        const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        if (isCollapsed) {
            sidebar.classList.add('collapsed');
        }
    });
</script>
</body>
</html>
